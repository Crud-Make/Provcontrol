name: CI/CD - ProvControl

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================
  # JOB 1: TESTES
  # ============================================
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testing
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql
          coverage: none

      - name: 📝 Copy .env
        run: cp .env.example .env

      - name: 📦 Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: 🔑 Generate Key
        run: php artisan key:generate

      - name: 🗄️ Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: testuser
          DB_PASSWORD: testpassword
        run: php artisan migrate --force

      - name: ✅ Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: testuser
          DB_PASSWORD: testpassword
        run: php artisan test --verbose

  # ============================================
  # JOB 2: QUALIDADE DE CÓDIGO
  # ============================================
  quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      
      - name: 📦 Install Dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: 🎨 Check Code Style (Pint)
        run: ./vendor/bin/pint --test || true
      
      - name: 🔍 Static Analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G || true

  # ============================================
  # JOB 3: DEPLOY (SÓ NA MAIN)
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [tests, quality]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 📤 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/provcontrol
            git pull origin main
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d --build
            docker exec provcontrol-app php artisan migrate --force
            docker exec provcontrol-app php artisan config:cache
            docker exec provcontrol-app php artisan route:cache
            docker exec provcontrol-app php artisan view:cache
            echo "✅ Deploy concluído!"
